<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCK Hub — Reach Map</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/vars.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/hub.css">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Leaflet.markercluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    body.hub-page.reach-map-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .reach-map-layout {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }
    #reachMap {
      flex: 1;
      min-height: 0;
      z-index: 1;
    }
    /* Side panel */
    .map-side-panel {
      width: 340px;
      flex-shrink: 0;
      background: #fff;
      border-left: 1px solid rgba(13,36,68,.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: -2px 0 12px rgba(13,36,68,.06);
      transition: width .25s ease;
    }
    .map-side-panel.collapsed { width: 0; }
    .map-side-panel-inner {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .map-side-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
    }
    /* Default state */
    .map-side-default {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      gap: 10px;
      padding: 24px;
    }
    .map-side-default svg { width: 40px; height: 40px; opacity: .35; }
    /* Group detail */
    .map-group-name { font-size: 17px; font-weight: 700; color: var(--text-white); margin-bottom: 4px; }
    .map-group-church { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
    .map-group-loc { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
    /* Legend */
    .map-legend {
      position: absolute;
      bottom: 24px;
      left: 16px;
      background: #fff;
      border: 1px solid rgba(13,36,68,.10);
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 2px 10px rgba(13,36,68,.12);
      z-index: 400;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    .legend-dot.partner  { background: #C9A84C; }
    .legend-dot.prospect { background: #6B7C9E; }
    /* No-map message */
    #mapNoData {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 18px 28px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(13,36,68,.14);
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      z-index: 500;
      pointer-events: none;
    }
  </style>
</head>
<body class="hub-page reach-map-page" data-hub-active="reach-map">

  <!-- Top nav injected by hub-nav.js -->

  <div class="reach-map-layout">
    <div id="reachMap"></div>

    <!-- Legend (over map) -->
    <div class="map-legend">
      <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;">Category</div>
      <div class="legend-item"><div class="legend-dot partner"></div> Partner</div>
      <div class="legend-item"><div class="legend-dot prospect"></div> Prospect</div>
    </div>

    <!-- No-data notice -->
    <div id="mapNoData">No geocoded youth groups yet.<br>Add groups with addresses to see them here.</div>

    <!-- Side panel -->
    <aside class="map-side-panel collapsed" id="mapSidePanel">
      <div class="map-side-panel-inner" id="mapSidePanelInner">
        <div class="map-side-default" id="mapSideDefault">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Click a pin to see group details
        </div>
        <div id="mapSideDetail" style="display:none;"></div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/hub-nav.js"></script>
  <script src="/js/reach-map.js"></script>
</body>
</html>
